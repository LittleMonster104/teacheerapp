services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: shiyuai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-123456}@mysql:3306/shiyuai
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
